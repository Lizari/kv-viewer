<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 背景 -->
  <rect width="32" height="32" rx="6" fill="#1e3a5f"/>

  <!-- テーブル外枠 -->
  <rect x="4" y="5" width="24" height="22" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- ヘッダ行の区切り線 -->
  <line x1="4" y1="11" x2="28" y2="11" stroke="#ffffff" stroke-width="1.5"/>

  <!-- 縦の区切り線（1本） -->
  <line x1="14" y1="5" x2="14" y2="27" stroke="#ffffff" stroke-width="1"/>

  <!-- ヘッダセル（塗りつぶし） -->
  <rect x="4.75" y="5.75" width="8.5" height="4.5" rx="1" fill="#4a7fc1"/>
  <rect x="14.75" y="5.75" width="12.5" height="4.5" rx="1" fill="#4a7fc1"/>

  <!-- データ行 1 -->
  <rect x="6" y="13" width="5" height="1.8" rx="0.9" fill="#a8c4e0"/>
  <rect x="16" y="13" width="9" height="1.8" rx="0.9" fill="#a8c4e0"/>

  <!-- データ行 2 -->
  <rect x="6" y="16.5" width="5" height="1.8" rx="0.9" fill="#a8c4e0"/>
  <rect x="16" y="16.5" width="7" height="1.8" rx="0.9" fill="#a8c4e0"/>

  <!-- データ行 3 -->
  <rect x="6" y="20" width="5" height="1.8" rx="0.9" fill="#a8c4e0"/>
  <rect x="16" y="20" width="9" height="1.8" rx="0.9" fill="#a8c4e0"/>

  <!-- プレビューを示す右下の小さな三角 -->
  <polygon points="22,24 28,24 28,27" fill="#61a0d4" opacity="0.9"/>
</svg>
